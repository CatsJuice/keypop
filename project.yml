name: KeyPop
options:
  bundleIdPrefix: com.catsjuice
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KeyPop:
    type: application
    platform: macOS
    sources:
      - path: KeyPop/Sources
      - path: KeyPop/Resources/Emoji
        type: folder
        buildPhase: resources
      - path: KeyPop/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: KeyPop/Info.plist
      properties:
        CFBundleDisplayName: KeyPop
        CFBundleName: KeyPop
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.kids-games
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Emoji © Microsoft Fluent Emoji (MIT)"
        NSPrincipalClass: NSApplication
    configFiles:
      Debug: KeyPop/Config/Signing.xcconfig
      Release: KeyPop/Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catsjuice.keypop
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
